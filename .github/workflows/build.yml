name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build and verify
        shell: pwsh
        run: ./scripts/build.ps1 -BuildRoot "$env:RUNNER_TEMP/autoclicker-build"
